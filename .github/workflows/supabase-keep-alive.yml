# Supabase pauses a free-tier project after about a week with no activity,
# and the site then fails (or the dashboard opens read-only). One small read a
# day counts as activity and keeps the project awake.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the public anon key — RLS limits it to published content
#
# If the run fails, the project is already paused or the secrets are wrong:
# restore it at https://supabase.com/dashboard and re-run this workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # A real table read, so it reaches Postgres rather than just the API gateway.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/site_settings?select=revision&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || status=000
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $status). The project may be paused — restore it at https://supabase.com/dashboard."
            exit 1
          fi
